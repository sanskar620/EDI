<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Trainee App - Video Player</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Manrope -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0056b2',
            surface: '#121212',
            overlay: 'rgba(0, 0, 0, 0.7)',
          },
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
          },
          borderRadius: {
            'custom': '8px',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="typography">
    body {
      font-family: 'Manrope', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
<style data-purpose="layout-ui">
    .video-overlay-gradient {
      background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
    }
    .slider-thumb-custom::-webkit-slider-thumb {
      appearance: none;
      width: 12px;
      height: 12px;
      background: #0056b2;
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="bg-black h-full overflow-hidden text-white flex flex-col">
<!-- BEGIN: Main Video Container -->
<main class="relative flex-grow flex items-center justify-center bg-black overflow-hidden" data-purpose="video-workspace">
<!-- Placeholder for Video Element -->
<div class="absolute inset-0 z-0">
<img alt="Video Placeholder" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDyvMxfuWzf8K7gTjR7IUFeB1YZ4pGDAVDnUllqXwvveAf4pxfjIOiRTQUE3Mk4k3qTa8FuK4AX7v1HlQ8pwDUoeudpAVqJAdydMME_aJ4Toris5OoLT8jYvm1t7vjnXFyPQplWa4tUYCj5i1NDAiMBz5pGMGrzSJ3mAnB5qYQJNtSSnndlsOBG4YMl069RHs-xpYrGngSU88vpwdrS9_xy9xrfbA1mb9TCf85jP90p7F7c0oBwfiwDKfKPx3uJyCJsr_0r_baE_xg"/>
</div>
<!-- UI Overlay Layer -->
<div class="absolute inset-0 z-10 video-overlay-gradient flex flex-col justify-between p-4 pb-8">
<!-- BEGIN: Header Navigation -->
<header class="flex items-center justify-between" data-purpose="top-navigation">
<button aria-label="Go Back" class="p-2 rounded-full bg-black/30 backdrop-blur-md">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<div class="text-center flex-1 mx-4">
<h1 class="text-sm font-semibold truncate">Lesson 4: Advanced Architectural Principles</h1>
<p class="text-[10px] text-gray-400 uppercase tracking-widest">Mastering the Grid</p>
</div>
<button aria-label="Settings" class="p-2 rounded-full bg-black/30 backdrop-blur-md">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</header>
<!-- END: Header Navigation -->
<!-- BEGIN: Center Controls (Play/Seek) -->
<div class="flex items-center justify-center gap-10" data-purpose="playback-controls-center">
<!-- Rewind 10s -->
<button class="group flex flex-col items-center">
<div class="p-3 rounded-full bg-black/20 group-active:bg-primary transition-colors">
<svg class="h-8 w-8" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.334 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<span class="text-[10px] mt-1 font-bold">10s</span>
</button>
<!-- Large Play/Pause -->
<button class="w-20 h-20 flex items-center justify-center rounded-full bg-primary shadow-lg shadow-primary/20" id="play-btn">
<svg class="h-10 w-10 ml-1" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M8 5v14l11-7z"></path>
</svg>
</button>
<!-- Fast Forward 10s -->
<button class="group flex flex-col items-center">
<div class="p-3 rounded-full bg-black/20 group-active:bg-primary transition-colors">
<svg class="h-8 w-8" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M11.934 12.8a1 1 0 000-1.6l-5.334-4A1 1 0 005 8v8a1 1 0 001.6.8l5.334-4zM19.934 12.8a1 1 0 000-1.6l-5.334-4A1 1 0 0013 8v8a1 1 0 001.6.8l5.334-4z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<span class="text-[10px] mt-1 font-bold">10s</span>
</button>
</div>
<!-- END: Center Controls -->
<!-- BEGIN: Bottom Controls & Progress -->
<section class="space-y-4" data-purpose="bottom-bar">
<!-- Next Lesson / Resource Preview Mini Sidebar -->
<div class="flex justify-end gap-2 mb-4">
<button class="bg-surface/60 backdrop-blur-xl border border-white/10 px-4 py-2 rounded-custom flex items-center gap-2 text-xs font-medium">
<svg class="h-4 w-4 text-primary" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
            Resources
          </button>
<button class="bg-white text-black px-4 py-2 rounded-custom flex items-center gap-2 text-xs font-bold">
            Next Lesson
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
<!-- Progress Bar -->
<div class="space-y-2">
<div class="flex justify-between text-[10px] font-semibold text-gray-300">
<span>04:20</span>
<span>12:45</span>
</div>
<div class="relative w-full h-1 bg-white/20 rounded-full">
<div class="absolute top-0 left-0 h-full bg-primary rounded-full w-[35%]"></div>
<div class="absolute top-1/2 left-[35%] -translate-y-1/2 w-3 h-3 bg-white rounded-full border-2 border-primary"></div>
</div>
</div>
<!-- Footer Actions -->
<div class="flex items-center justify-between pt-2">
<div class="flex items-center gap-4">
<button class="flex flex-col items-center gap-1 opacity-80 active:opacity-100">
<svg class="h-5 w-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<button class="text-xs font-bold text-primary px-2 py-1 rounded bg-primary/10">1.25x</button>
</div>
<div class="flex items-center gap-5">
<button class="text-[11px] font-bold text-gray-300">1080p</button>
<button aria-label="Fullscreen">
<svg class="h-5 w-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
</section>
<!-- END: Bottom Controls & Progress -->
</div>
</main>
<!-- END: Main Video Container -->
<!-- BEGIN: Interaction Script -->
<script data-purpose="ui-interactions">
    // Simplified interaction script for play/pause toggle visualization
    const playBtn = document.getElementById('play-btn');
    let isPlaying = false;

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if(isPlaying) {
        playBtn.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
          </svg>
        `;
      } else {
        playBtn.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 ml-1" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z" />
          </svg>
        `;
      }
    });
  </script>
<!-- END: Interaction Script -->
</body></html>
