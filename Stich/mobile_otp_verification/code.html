<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OTP Verification</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0056b2",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1923",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col items-center justify-center">
<div class="relative w-full max-w-md h-screen md:h-auto md:min-h-[700px] flex flex-col bg-background-light dark:bg-background-dark overflow-hidden">
<!-- Top App Bar / Navigation -->
<div class="flex items-center p-4">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">arrow_back</span>
</button>
</div>
<div class="flex-1 flex flex-col px-6 pt-8 pb-10">
<!-- Header Section -->
<div class="mb-8">
<h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-slate-100 mb-3">Verify Phone Number</h1>
<p class="text-slate-600 dark:text-slate-400 text-base leading-relaxed">
                    Enter the 6-digit code sent to your phone <span class="text-primary font-semibold">+1 (555) 000-0000</span> via SMS/WhatsApp.
                </p>
</div>
<!-- OTP Input Section -->
<div class="flex justify-between gap-2 mb-10">
<input class="w-12 h-14 text-center text-2xl font-bold bg-slate-100 dark:bg-slate-800 border-2 border-transparent focus:border-primary focus:ring-0 rounded-xl transition-all outline-none" maxlength="1" placeholder="•" type="number"/>
<input class="w-12 h-14 text-center text-2xl font-bold bg-slate-100 dark:bg-slate-800 border-2 border-transparent focus:border-primary focus:ring-0 rounded-xl transition-all outline-none" maxlength="1" placeholder="•" type="number"/>
<input class="w-12 h-14 text-center text-2xl font-bold bg-slate-100 dark:bg-slate-800 border-2 border-transparent focus:border-primary focus:ring-0 rounded-xl transition-all outline-none" maxlength="1" placeholder="•" type="number"/>
<input class="w-12 h-14 text-center text-2xl font-bold bg-slate-100 dark:bg-slate-800 border-2 border-transparent focus:border-primary focus:ring-0 rounded-xl transition-all outline-none" maxlength="1" placeholder="•" type="number"/>
<input class="w-12 h-14 text-center text-2xl font-bold bg-slate-100 dark:bg-slate-800 border-2 border-transparent focus:border-primary focus:ring-0 rounded-xl transition-all outline-none" maxlength="1" placeholder="•" type="number"/>
<input class="w-12 h-14 text-center text-2xl font-bold bg-slate-100 dark:bg-slate-800 border-2 border-transparent focus:border-primary focus:ring-0 rounded-xl transition-all outline-none" maxlength="1" placeholder="•" type="number"/>
</div>
<!-- Timer and Resend -->
<div class="flex flex-col items-center gap-4 mb-auto">
<div class="flex items-center gap-3 py-3 px-6 rounded-full bg-primary/10 dark:bg-primary/20 border border-primary/20">
<span class="material-symbols-outlined text-primary text-xl">timer</span>
<span class="text-primary font-bold text-lg">00:45</span>
</div>
<p class="text-sm text-slate-500 dark:text-slate-400">
                    Didn't receive the code? 
                    <button class="text-primary font-bold hover:underline opacity-50 cursor-not-allowed">Resend Code</button>
</p>
</div>
<!-- Actions -->
<div class="flex flex-col gap-4 mt-8">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
                    Verify &amp; Continue
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
<button class="w-full py-3 text-slate-600 dark:text-slate-400 font-semibold hover:text-primary transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-lg">edit</span>
                    Change Phone Number
                </button>
</div>
</div>
<!-- Decorative Element -->
<div class="absolute -bottom-24 -left-24 w-64 h-64 bg-primary/10 rounded-full blur-3xl -z-10"></div>
<div class="absolute -top-24 -right-24 w-64 h-64 bg-primary/5 rounded-full blur-3xl -z-10"></div>
</div>
</body></html>
