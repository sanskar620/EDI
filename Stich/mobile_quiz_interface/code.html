<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Trainee Quiz - Mobile UI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0056b2",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1923",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .radio-custom:checked {
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3ccircle cx='8' cy='8' r='3'/%3e%3c/svg%3e");
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
<div class="relative flex h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-hidden max-w-md mx-auto border-x border-slate-200 dark:border-slate-800">
<!-- Header Section -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between">
<button class="text-slate-900 dark:text-slate-100 flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center">Trainee Quiz</h2>
<button class="text-slate-900 dark:text-slate-100 flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined">help_outline</span>
</button>
</div>
<!-- Progress Section -->
<div class="flex flex-col gap-3 p-4">
<div class="flex gap-6 justify-between items-end">
<p class="text-slate-900 dark:text-slate-100 text-sm font-semibold uppercase tracking-wider">Question 3 of 10</p>
<p class="text-primary text-sm font-bold leading-normal">30% Complete</p>
</div>
<div class="h-2.5 w-full rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
<div class="h-full rounded-full bg-primary transition-all duration-500" style="width: 30%;"></div>
</div>
</div>
<!-- Stats Cards -->
<div class="flex flex-wrap gap-3 p-4">
<div class="flex min-w-[140px] flex-1 flex-col gap-1 rounded-xl p-4 bg-slate-100 dark:bg-primary/10 border border-slate-200 dark:border-primary/20">
<div class="flex items-center gap-2 text-slate-600 dark:text-slate-400">
<span class="material-symbols-outlined text-sm">timer</span>
<p class="text-xs font-medium uppercase tracking-wide">Remaining</p>
</div>
<p class="text-slate-900 dark:text-slate-100 tracking-tight text-2xl font-extrabold">00:45</p>
</div>
<div class="flex min-w-[140px] flex-1 flex-col gap-1 rounded-xl p-4 bg-slate-100 dark:bg-primary/10 border border-slate-200 dark:border-primary/20">
<div class="flex items-center gap-2 text-slate-600 dark:text-slate-400">
<span class="material-symbols-outlined text-sm">stars</span>
<p class="text-xs font-medium uppercase tracking-wide">Point Value</p>
</div>
<p class="text-slate-900 dark:text-slate-100 tracking-tight text-2xl font-extrabold">100 pts</p>
</div>
</div>
<!-- Question Area -->
<div class="flex-1 overflow-y-auto px-4 py-2">
<h3 class="text-slate-900 dark:text-slate-100 tracking-tight text-2xl font-bold leading-snug text-left py-4">
                Which of these is a core principle of UX design to ensure user satisfaction?
            </h3>
<!-- Options -->
<div class="flex flex-col gap-3 mt-4">
<label class="group flex items-center gap-4 rounded-xl border-2 border-slate-200 dark:border-slate-800 p-4 transition-all hover:border-primary cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-primary/5">
<input checked="" class="radio-custom h-6 w-6 border-2 border-slate-300 dark:border-slate-700 bg-transparent text-primary focus:ring-primary focus:ring-offset-0 checked:bg-primary checked:border-primary" name="quiz_option" type="radio"/>
<div class="flex grow flex-col">
<p class="text-slate-900 dark:text-slate-100 text-base font-semibold">User-Centricity</p>
</div>
</label>
<label class="group flex items-center gap-4 rounded-xl border-2 border-slate-200 dark:border-slate-800 p-4 transition-all hover:border-primary cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-primary/5">
<input class="radio-custom h-6 w-6 border-2 border-slate-300 dark:border-slate-700 bg-transparent text-primary focus:ring-primary focus:ring-offset-0 checked:bg-primary checked:border-primary" name="quiz_option" type="radio"/>
<div class="flex grow flex-col">
<p class="text-slate-900 dark:text-slate-100 text-base font-semibold">Visual Complexity</p>
</div>
</label>
<label class="group flex items-center gap-4 rounded-xl border-2 border-slate-200 dark:border-slate-800 p-4 transition-all hover:border-primary cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-primary/5">
<input class="radio-custom h-6 w-6 border-2 border-slate-300 dark:border-slate-700 bg-transparent text-primary focus:ring-primary focus:ring-offset-0 checked:bg-primary checked:border-primary" name="quiz_option" type="radio"/>
<div class="flex grow flex-col">
<p class="text-slate-900 dark:text-slate-100 text-base font-semibold">Maximum Features</p>
</div>
</label>
<label class="group flex items-center gap-4 rounded-xl border-2 border-slate-200 dark:border-slate-800 p-4 transition-all hover:border-primary cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-primary/5">
<input class="radio-custom h-6 w-6 border-2 border-slate-300 dark:border-slate-700 bg-transparent text-primary focus:ring-primary focus:ring-offset-0 checked:bg-primary checked:border-primary" name="quiz_option" type="radio"/>
<div class="flex grow flex-col">
<p class="text-slate-900 dark:text-slate-100 text-base font-semibold">Aesthetic Only Focus</p>
</div>
</label>
</div>
</div>
<!-- Navigation Footer -->
<div class="p-4 bg-background-light dark:bg-background-dark border-t border-slate-200 dark:border-slate-800 flex gap-4">
<button class="flex-1 flex items-center justify-center gap-2 py-4 px-6 rounded-xl font-bold text-slate-600 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
<span class="material-symbols-outlined">chevron_left</span>
                Previous
            </button>
<button class="flex-[2] flex items-center justify-center gap-2 py-4 px-6 rounded-xl font-bold text-white bg-primary hover:bg-primary/90 transition-all shadow-lg shadow-primary/20">
                Next Question
                <span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</div>
</body></html>
